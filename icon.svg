<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <mask id="gat" maskUnits="userSpaceOnUse" x="-300" y="-300" width="600" height="600">
      <rect x="-300" y="-300" width="600" height="600" fill="#fff"/>
      <!-- bek van de steeksleutel -->
      <rect x="-21" y="-215" width="42" height="80" fill="#000"/>
      <circle cx="0" cy="-130" r="21" fill="#000"/>
      <!-- gat in het andere eind -->
      <circle cx="0" cy="150" r="17" fill="#000"/>
    </mask>
    <g id="sleutel" mask="url(#gat)">
      <rect x="-24" y="-110" width="48" height="262" rx="24"/>
      <circle cx="0" cy="-130" r="60"/>
      <circle cx="0" cy="150" r="42"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="#2b3a44"/>
  <g transform="translate(256 262) scale(.86) translate(-256 -262)">
    <!-- dakje -->
    <polyline points="92,196 256,74 420,196" fill="none" stroke="#f08a2c" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- gekruiste sleutels -->
    <g transform="translate(256 330) scale(.88)">
      <use href="#sleutel" transform="rotate(-45)" fill="#e9ece6"/>
      <use href="#sleutel" transform="rotate(45)" fill="#2b3a44" stroke="#2b3a44" stroke-width="30" stroke-linejoin="round"/>
      <use href="#sleutel" transform="rotate(45)" fill="#e9ece6"/>
    </g>
  </g>
</svg>
