<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Werkplaatsbord</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b3a44">
<meta name="description" content="Storingen melden met foto, per machine, en onderhoud bijhouden in de werkplaats.">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Werkplaats">
<style>
/* Lettertype staat in de app zelf (Barlow, SIL OFL; zie fonts/OFL.txt): geen verzoeken naar Google */
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
/* Eén rustige app-kolom (telefoon), sticky kop met tabs, vaste onderbalk. Licht, weinig lijnen, één accent. */
:root{
  --bg:#f4f5f2; --surface:#ffffff; --surface-2:#eef0ec; --fg:#1d2320; --muted:#646d66; --line:#e1e4de;
  --accent:#2b3a44; --on-accent:#ffffff; --roof:#e07a1f;
  --urgent:#c2410c; --urgent-soft:#fdece2;
  --busy:#1d5f8a; --busy-soft:#e3eff8;
  --done:#3d6a39; --done-soft:#e6f0e2;
  --old:#8a5f00; --old-soft:#fbf1d3;
  --shadow:0 1px 2px rgba(20,30,25,.05),0 2px 8px rgba(20,30,25,.04);
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a1f1c; --surface-2:#232a26; --fg:#e7ebe6; --muted:#97a199; --line:#2b332e;
  --accent:#dbe3dd; --on-accent:#141917; --roof:#f08a2c;
  --urgent:#fb8f55; --urgent-soft:#38231a;
  --busy:#7bb9e3; --busy-soft:#18293a;
  --done:#93c78a; --done-soft:#1d2b1c;
  --old:#e8bd52; --old-soft:#342a12;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a1f1c; --surface-2:#232a26; --fg:#e7ebe6; --muted:#97a199; --line:#2b332e;
  --accent:#dbe3dd; --on-accent:#141917; --roof:#f08a2c;
  --urgent:#fb8f55; --urgent-soft:#38231a;
  --busy:#7bb9e3; --busy-soft:#18293a;
  --done:#93c78a; --done-soft:#1d2b1c;
  --old:#e8bd52; --old-soft:#342a12;
  --shadow:none; color-scheme:dark}

*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
img{max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--busy);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-weight:600;font-size:1.4rem;letter-spacing:-.01em;margin:0;line-height:1.2;display:flex;align-items:center;gap:8px}
h1 img{width:28px;height:28px;border-radius:7px}
.who{border:0;background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:.88rem;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.who b{color:var(--fg);font-weight:600}
.syncstat{font-size:.82rem;color:var(--muted);margin:-6px 0 0;display:flex;gap:6px;align-items:center}
.installtip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px;font-size:.9rem}
.installtip a{color:var(--fg);font-weight:500;flex:1;text-decoration:none}
.installtip button{border:0;background:none;color:var(--muted);width:32px;height:32px;font-size:1.1rem;flex:none}
.syncstat .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.syncstat.ok .dot{background:var(--done)}
.syncstat.fout .dot{background:var(--urgent)}
.syncstat.bezig .dot{background:var(--busy)}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--surface-2);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:8px 4px;font-weight:500;font-size:.92rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tabs .n{font-size:.76rem;font-weight:600;min-width:1.6em;padding:1px 6px;border-radius:999px;background:var(--line);color:var(--fg);font-variant-numeric:tabular-nums}
.tabs button[data-tab="dringend"] .n{background:var(--urgent-soft);color:var(--urgent)}

.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats.wrap{flex-wrap:wrap;overflow:visible}
.cats button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem;font-weight:500;min-height:36px}
.cats button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.cats .c{color:var(--muted);margin-left:6px;font-size:.78rem;font-variant-numeric:tabular-nums}
.cats button[aria-pressed="true"] .c{color:inherit;opacity:.7}

.list{display:grid;gap:12px;margin-top:4px}
.empty{padding:40px 12px;text-align:center;color:var(--muted);margin:0}

/* groep per machine */
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.ghead{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px 2px;background:none;border:0;text-align:left;color:var(--fg)}
.ghead:disabled{cursor:default;color:var(--fg)}
.ghead .right{display:flex;gap:6px;align-items:center}
.gcount{font-size:.82rem;color:var(--muted);white-space:nowrap}
.chev{display:inline-block;color:var(--muted);font-size:.85rem;transition:transform .15s}
.ghead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.group.is-open .ghead{padding-bottom:6px}
.gsum{display:grid;gap:3px;width:100%;text-align:left;background:none;border:0;padding:6px 14px 12px;overflow:hidden}
.gl{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem;padding-left:13px;position:relative;min-width:0}
.gl::before{content:"";position:absolute;left:2px;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.gmore{font-size:.8rem;color:var(--muted);margin-top:4px}
.gfoot{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 14px;color:var(--muted);font-size:.86rem}
.nr{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:.4em}
.mname{font-weight:600;font-size:1.05rem;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.row{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:10px 14px;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row.dringend:not(.klaar)::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--urgent)}
.thumb{width:52px;height:52px;border-radius:8px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.7rem;text-align:center;position:relative;z-index:1;pointer-events:none;line-height:1.2}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .more{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.6);color:#fff;font-weight:600;font-size:.7rem;border-radius:4px;padding:0 4px}
.cbody{min-width:0;display:grid;gap:3px;align-content:start}
.crow{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.age{font-size:.82rem;color:var(--muted);white-space:nowrap}
.txt{margin:0;overflow-wrap:anywhere;font-weight:500;font-size:1rem;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-weight:500;font-size:.8rem;white-space:nowrap}
.chip.open,.chip.none,.chip.onb{background:var(--surface-2);color:var(--muted)}
.chip.klaar,.chip.ok,.chip.oh{background:var(--done-soft);color:var(--done)}
.chip.oud,.chip.soon{background:var(--old-soft);color:var(--old)}
.chip.dringend,.chip.late{background:var(--urgent-soft);color:var(--urgent)}
.actions{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;position:relative;z-index:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 14px;font-weight:500;font-size:.94rem;min-height:42px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.done{background:var(--done-soft);color:var(--done);border-color:transparent}
.btn.warn{color:var(--urgent)}
.row .actions .btn{min-height:38px;padding:5px 14px;font-size:.9rem}
.row .open-detail{position:absolute;inset:0;background:none;border:0;width:100%}

/* machines */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.mtile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:grid;gap:4px;align-content:start;box-shadow:var(--shadow)}
.mtile .t{font-size:.78rem;color:var(--muted)}
.mtile .nm{font-weight:600;font-size:1rem;line-height:1.25}
.mtile .st{font-size:.82rem;color:var(--muted)}
.kent{justify-self:start;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;font-weight:500;font-size:.8rem;letter-spacing:.03em;line-height:1.5;white-space:nowrap}
.mtile .st b{color:var(--urgent);font-weight:600}
.mtile .chip{margin-top:2px}
.mtile .chips{display:flex;flex-wrap:wrap;gap:4px}
.section-h{font-weight:600;text-transform:uppercase;font-size:.76rem;letter-spacing:.07em;color:var(--muted);margin:20px 0 0}
.duelist{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px;box-shadow:var(--shadow)}
.due{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border:0;background:none;text-align:left;width:100%}
.due+.due{border-top:1px solid var(--line)}
.due .go{color:var(--muted);font-size:1.3rem;line-height:1}
.due.instel .mname{color:var(--busy)}
.due .sub{display:block;font-size:.84rem;color:var(--muted)}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px 0;font-size:.88rem;justify-self:start}
.voet{text-align:center;color:var(--muted);font-size:.78rem;margin-top:28px}

/* onderbalk */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bb-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.nav{border:0;background:none;padding:9px 6px;font-weight:500;font-size:.95rem;color:var(--muted);border-radius:9px}
.nav[aria-current="page"]{color:var(--fg);font-weight:600}
.fab{border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:1rem;border-radius:999px;padding:11px 22px;min-height:48px}

/* sheet */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,14,12,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;overscroll-behavior:contain;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h2{font-weight:600;font-size:1.25rem;margin:0;line-height:1.25;text-wrap:balance}
.sheet .grote{margin:0;font-size:1.05rem;font-weight:500;overflow-wrap:anywhere}
.x{border:0;background:var(--surface-2);border-radius:999px;width:38px;height:38px;font-size:1.15rem;line-height:1;flex:none;color:var(--muted)}
.field{display:grid;gap:6px}
.field>label,.lbl{font-weight:500;font-size:.88rem;color:var(--muted)}
.field>label span,.lbl span{font-weight:400}
.hint{font-size:.86rem;color:var(--muted);margin:0}
.fotos{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{display:grid;place-items:center;width:88px;height:88px;border:1.5px dashed var(--line);border-radius:10px;background:var(--surface);text-align:center;color:var(--muted);font-size:.8rem;cursor:pointer;line-height:1.3}
.fbtn strong{color:var(--fg);display:block;font-size:.92rem;font-weight:600}
.fprev{width:88px;height:88px;border-radius:10px;overflow:hidden;position:relative}
.fprev img{width:100%;height:100%;object-fit:cover;display:block}
.fprev button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:999px;border:0;background:rgba(0,0,0,.6);color:#fff;line-height:1}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input[type=text],input[type=search],input[type=url],input[type=date],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:46px;font-size:16px}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;font-size:.95rem}
.check input{width:22px;height:22px}
.mpick{display:flex;flex-wrap:wrap;gap:6px;max-height:200px;overflow:auto;padding:2px}
.mpick button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 11px;font-weight:500;font-size:.94rem;text-align:left;min-height:42px}
.mpick button small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}
.mpick button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mpick button[aria-pressed="true"] small{color:inherit;opacity:.75}
.prio{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prio button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 10px;font-weight:500;min-height:50px}
.prio button[aria-pressed="true"][data-p="dringend"]{border-color:var(--urgent);background:var(--urgent-soft);color:var(--urgent)}
.prio button[aria-pressed="true"][data-p="tijd"]{border-color:var(--accent);background:var(--surface-2);font-weight:600}
.groot{min-height:50px!important;font-size:1rem!important;font-weight:600}
.err{color:var(--urgent);font-weight:500;font-size:.92rem;margin:0}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.gallery .gf{height:240px;flex:none;max-width:85%;scroll-snap-align:start;border-radius:12px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:.85rem;aspect-ratio:3/4}
.gallery .gf:only-child{max-width:100%;width:100%;aspect-ratio:auto}
.gallery img{height:100%;width:100%;object-fit:cover;display:block;cursor:zoom-in}
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.4rem}
.kv{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kv div{display:flex;justify-content:space-between;gap:12px;font-size:.94rem;align-items:baseline}
.kv div>span:first-child{color:var(--muted);flex:none}
.kv div>span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.hist{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hist .h{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 14px;border-top:1px solid var(--line)}
.hist .h:first-child{border-top:0}
.hist .hb{width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;grid-template-columns:auto 1fr auto;align-items:start}
.hist .hb:first-child{border-top:0}
.hist .hb:active{background:var(--surface-2)}
.hist .go{color:var(--muted);font-size:1.2rem;line-height:1.2}
.hist .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.84rem;white-space:nowrap}
.hist p{margin:0;overflow-wrap:anywhere;font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.35rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.copybox{font-size:.84rem;word-break:break-all;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;user-select:all;-webkit-user-select:all}
.sheet.slepen{outline:3px dashed var(--busy);outline-offset:-8px;background:var(--busy-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--accent);color:var(--on-accent);padding:9px 16px;border-radius:999px;font-weight:500;font-size:.92rem;max-width:calc(100% - 32px);text-align:center}
/* pc/tablet: venster in het midden, dan klik je er minder snel naast */
@media (min-width:700px) and (min-height:520px){.overlay{align-items:center;padding:24px}.sheet{border-radius:16px;max-height:88vh;padding-bottom:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}}
/* afdrukken / PDF: alleen #printRoot, altijd licht */
#printRoot{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff!important;color:#000}
  body::before,.app,.bottombar,#sheetRoot,.toast,.viewer{display:none!important}
  #printRoot{display:block;font-family:var(--f-body);font-size:10pt;line-height:1.35;color:#000}
  .pr-pag{break-after:page}
  .pr-pag:last-child{break-after:auto}
  .pr-pag h1{font-size:17pt;margin:0 0 2pt;display:block}
  .pr-sub{color:#555;margin:0 0 8pt}
  .pr-pag h2{font-size:11.5pt;margin:12pt 0 4pt}
  .pr-kv{display:grid;grid-template-columns:auto 1fr;gap:2pt 14pt;margin:0}
  .pr-kv dt{color:#555}
  .pr-kv dd{margin:0}
  #printRoot table{width:100%;border-collapse:collapse}
  #printRoot th{text-align:left;font-weight:600;border-bottom:1.2pt solid #000;padding:3pt 5pt 3pt 0}
  #printRoot td{border-bottom:.5pt solid #bbb;padding:3pt 5pt 3pt 0;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}
  #printRoot tr{break-inside:avoid}
  #printRoot .r{text-align:right;font-variant-numeric:tabular-nums}
  #printRoot .nw{white-space:nowrap}
  .pr-leeg{color:#555;margin:0}
  .pr-k{color:#777;font-size:8.5pt}
  .pr-invul td{height:30pt;border:.6pt solid #999;padding:3pt 5pt}
  .pr-invul th{border:.6pt solid #999;border-bottom:1.2pt solid #000;padding:3pt 5pt;font-size:9pt}
  .pr-invul td:first-child{width:28%}

const LIJST_KOPPEL = {

  "1106": ["Kobelco SK210-11 (Lucas)", "Kobelco rupskraan (groot)"], "1000": ["Volvo L60E"], "1001": ["Volvo L60F"]
};
const LIJST_VERSIE = 7; // 3: Amazone-strooiers 1321 en 1322 erbij; 4: 0715 terug; 5: gegevens 0715 aangevuld; 6: ingeruild weg, quad erbij; 7: 0715 info T214
// Aanvullen per machinenummer: alleen velden die nog leeg zijn (wat iemand zelf invulde blijft staan)
const LIJST_AANVUL = { "0715": { chassis: "YK5T174D0MS043017", info: "Gechipt naar T214" } };
// Verbeteren: [veld, oude waarde, nieuwe waarde]; alleen als er nog precies de oude waarde staat
const LIJST_VERBETER = { "0715": [["info", "Gechipt naar T234", "Gechipt naar T214"]] };
// Per ongeluk weggehaald: terugzetten, maar alleen als het weghalen vóór dit tijdstip was (later weghalen blijft weg)
const LIJST_TERUG = { "0715": Date.parse("2026-11-27T15:00:00Z") };
// Uit de lijst gehaald (1424 = dubbel met 1419; 0703, 0706, 0710 = ingeruild). Al ingelezen? Dan weg, als er nog niks bij staat.
const LIJST_VERVALLEN = ["1424", "0703", "0706", "0710"]; // 0703/0706/0710 ingeruild
// Eén keer per apparaat (wpbLijst): de machinelijst van de werkplaats erin zetten. Met de groep pas na een geslaagde
// sync, zodat het apparaat ziet wat er al is. Bestaande machines houden hun naam en alles wat erbij staat; ze krijgen
// alleen nummer, merk/type, bouwjaar en (als dat leeg is) kenteken. Nieuwe machines krijgen id n<nr> met g = 1: wat al in
// de groep staat (of daar is weggehaald) wint altijd, en twee apparaten tegelijk maken geen dubbele.
function lijstInlezen() {
  if (store.get("wpbLijst", 0) >= LIJST_VERSIE) return false;
  const kent = k => String(k || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const metNr = new Set(db.machines.map(m => m.nr).filter(Boolean));
  let veranderd = false;
  for (const m of db.machines.slice()) {
    if (m.nr) continue;
    const naam = m.naam.trim().toLowerCase();
    const r = MACHINELIJST.find(r => !metNr.has(r[0]) && r[2] && kent(r[2]) === kent(m.kenteken))
      || MACHINELIJST.find(r => !metNr.has(r[0]) && (LIJST_KOPPEL[r[0]] || []).some(n => n.toLowerCase() === naam))
      || MACHINELIJST.find(r => !metNr.has(r[0]) && r[1].toLowerCase() === naam);
    if (!r) continue;
    metNr.add(r[0]);
    const n = Object.assign({}, m, { nr: r[0], model: m.model || r[4], bouwjaar: m.bouwjaar || r[5], kenteken: m.kenteken || r[2] });
    if (groepAan()) wijzig("machine", n); // net bijgewerkt met de groep: deze wijziging mag winnen
    else { db.machines[db.machines.findIndex(x => x.id === m.id)] = n; if (!meta[m.id]) meta[m.id] = { s: "machine", g: 1 }; }
    veranderd = true;
  }
  for (const r of MACHINELIJST) {
    const id = "n" + r[0];
    if (metNr.has(r[0]) || meta[id] || db.machines.some(m => m.id === id)) continue; // bestaat al, of is weggehaald
    db.machines.push({ id, nr: r[0], naam: r[1], kenteken: r[2], type: r[3], model: r[4], bouwjaar: r[5], cat: CATS[r[6]], urenteller: !!r[7], uren: null, interval: {} });
    meta[id] = { s: "machine", g: 1 };
    if (groepAan()) dirty.add(id);
    veranderd = true;
  }
  for (const [nr, voor] of Object.entries(LIJST_TERUG)) {
    const id = "n" + nr, r = MACHINELIJST.find(x => x[0] === nr), mt = meta[id];
    if (!r || db.machines.some(m => m.nr === nr) || !mt || !mt.weg || mt.g > voor) continue;
    wijzig("machine", { id, nr: r[0], naam: r[1], kenteken: r[2], type: r[3], model: r[4], bouwjaar: r[5], cat: CATS[r[6]], urenteller: !!r[7], uren: null, interval: {} });
    veranderd = true;
  }
  for (const [nr, velden] of Object.entries(LIJST_AANVUL)) {
    const m = db.machines.find(x => x.nr === nr); if (!m) continue;
    const bij = {}; for (const [k, v] of Object.entries(velden)) if (!m[k]) bij[k] = v;
    if (Object.keys(bij).length) { wijzig("machine", Object.assign({}, m, bij)); veranderd = true; }
  }
  for (const [nr, lijstje] of Object.entries(LIJST_VERBETER)) {
    const m = db.machines.find(x => x.nr === nr); if (!m) continue;
    const bij = {}; for (const [k, oud, nieuw] of lijstje) if (m[k] === oud) bij[k] = nieuw;
    if (Object.keys(bij).length) { wijzig("machine", Object.assign({}, m, bij)); veranderd = true; }
  }
  for (const nr of LIJST_VERVALLEN) {
    const id = "n" + nr, m = mach(id);
    if (!m || m.nr !== nr || [db.meldingen, db.onderhoud, db.keuringen].some(l => l.some(x => x.machineId === id))) continue;
    verwijder("machine", id); veranderd = true;
  }
  store.set("wpbLijst", LIJST_VERSIE);
  if (veranderd) { bewaar(); planSync(); }
  return veranderd;
}

const vanDag = v => v ? new Date(v + "T12:00").getTime() : null;
function kStatus(k) {

const keuringenVan = mid => db.keuringen.filter(k => k.machineId === mid).sort((a, b) => a.tot - b.tot);
const kVerloopt = ms => { const ids = new Set(ms.map(m => m.id)); return db.keuringen.filter(k => ids.has(k.machineId)).map(k => ({ k, s: kStatus(k) })).filter(o => o.s.lvl !== "ok").sort((a, b) => a.k.tot - b.k.tot); };
const addMonths = (ts, n) => { const d = new Date(ts); d.setMonth(d.getMonth() + n); return d.getTime(); };
// "Laatste beurt invullen": alleen machines met een urenteller of een interval (niet elke kraanbak of kettingzaag)

  if (/maai|hark|tank|wagen|kipper|ploeg|cultivator|spuit|schudder|pers|zaai|frees|eg\b|werktuig|bak|klepel|bezem|veeg/.test(t)) return "Werktuigen";

function ohStatus(m) {

/* ---------- foto's ---------- */
const fotoMem = new Map(), fotoBezig = new Map(), fotoMis = new Map();
function fotoUrl(id) {
  if (fotoMem.has(id)) return Promise.resolve(fotoMem.get(id));
  if (fotoBezig.has(id)) return fotoBezig.get(id);
  if (Date.now() - (fotoMis.get(id) || 0) < 60000) return Promise.resolve(null);
  const p = fotoDb.get(id).catch(() => null).then(async d => {
    if (d) return d;
    if (!groepAan() || !navigator.onLine) return null;
    try { const r = await vraag(null, id); if (r && r.ok && isBeeld(r.data)) { fotoDb.set(id, r.data).catch(() => {}); return r.data; } } catch (e) {}
    return null;
  }).then(d => { fotoBezig.delete(id); if (d) fotoMem.set(id, d); else fotoMis.set(id, Date.now()); return d; });
  fotoBezig.set(id, p); return p;
}
function vulFotos(root) {
  root.querySelectorAll("[data-foto]").forEach(el => {
    if (el.dataset.klaar) return; el.dataset.klaar = "1";
    fotoUrl(el.dataset.foto).then(u => {
      const ph = el.querySelector(".ph");
      if (u) { const img = document.createElement("img"); img.alt = "Foto"; img.src = u; ph ? ph.replaceWith(img) : el.prepend(img); }
      else if (ph) ph.textContent = "foto nog niet binnen";
    });
  });
}
// Foto verkleinen: groot (1600 px, scherp genoeg voor een typeplaatje) en een mini-voorbeeld voor de lijst
function maakFoto(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const schaal = (max, q) => { const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", q); };
      res({ data: schaal(1600, 0.8), thumb: schaal(200, 0.7) });
    }; img.onerror = rej; img.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
const isBeeld = d => typeof d === "string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(d);

/* ---------- groep (Google Sheet) ---------- */
const sync = { bezig: false, laatst: store.get("wpbLaatst", 0), fout: "", timer: null, soorten: null, vapid: "", bestanden: false };
// Een ouder Google-script kent alleen deze soorten (en zegt niet welke het kent); keuringen blijven dan hier tot het script is bijgewerkt
const OUDE_SOORTEN = ["storing", "machine", "onderhoud"];
const kanDelen = soort => (sync.soorten || OUDE_SOORTEN).includes(soort);
const teVersturen = () => [...dirty].filter(id => !meta[id] || kanDelen(meta[id].s));
async function vraag(body, foto) {
  const ac = typeof AbortController === "function" ? new AbortController() : null, t = ac ? setTimeout(() => ac.abort(), 30000) : null;
  try {
    const code = groep.code.trim(), opts = { signal: ac ? ac.signal : undefined, cache: "no-store" };
    const res = body
      ? await fetch(groepUrl(), Object.assign(opts, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ code, apparaat: apparaatId }, body)) }))
      : await fetch(groepUrl() + "?code=" + encodeURIComponent(code) + (foto ? (foto.startsWith("d_") ? "&bestand=" : "&foto=") + encodeURIComponent(foto) : "&apparaat=" + encodeURIComponent(apparaatId)), opts);
    return await res.json();
  } finally { if (t) clearTimeout(t); }
}
function omschr(soort, o) {
  if (soort === "storing") return [mName(o), o.tekst, o.prio === "dringend" ? "dringend" : "als er tijd is", o.status === "klaar" ? "klaar" : "open"].join(" · ");
  if (soort === "machine") return `${o.nr ? o.nr + " " : ""}${o.naam} (${catOf(o)})`;
  if (soort === "keuring") return [mach(o.machineId)?.naam || "?", o.soort, "geldig tot " + csvDatum(o.tot)].join(" · ");
  return [mach(o.machineId)?.naam || "?", o.wat, o.uren != null ? nf(o.uren) + " uur" : ""].filter(Boolean).join(" · ");
}
function rijVan(id) {
  const m = meta[id]; if (!m) return null;
  if (m.weg) return { id, soort: m.s, gewijzigd: m.g, van: me, weg: true };
  const o = db[LIJST[m.s]].find(x => x.id === id); if (!o) return null;
  return { id, soort: m.s, gewijzigd: m.g, van: me, omschrijving: omschr(m.s, o), data: o };
}
function planSync(ms) { if (!groepAan()) { statusTekst(); return; } clearTimeout(sync.timer); sync.timer = setTimeout(syncNu, ms == null ? 2500 : ms); statusTekst(); }
async function syncNu() {
  if (!groepAan() || sync.bezig) return;
  sync.bezig = true; statusTekst();
  let nogEens = false;
  try {
    // 1. foto's die nog niet in de groep staan
    let wacht = store.get("wpbFotoWacht", []);
    for (const fid of [...wacht]) {
      const isBestand = fid.startsWith("d_");
      if (isBestand && !sync.bestanden) continue; // ouder script kent geen rapporten: bewaren tot het is bijgewerkt
      const d = await fotoDb.get(fid).catch(() => null);
      if (d && isBestand) {
        const r = await vraag({ bestand: { id: fid, data: d, omschrijving: bestandOmschr(fid) } });
        if (!r || !r.ok) throw new Error(r && r.fout || "bestand");
      } else if (d) {
        const st = db.meldingen.find(x => (x.fotos || []).includes(fid));
        const r = await vraag({ foto: { id: fid, data: d, omschrijving: st ? [mName(st), st.tekst, st.door, fmtDate(st.t)].join(" · ") : "" } });
        if (!r || !r.ok) throw new Error(r && r.fout || "foto");

    ids.forEach(id => { const r = rijVan(id); if (r) { stuur.push(r); gBij[id] = r.gewijzigd; } else dirty.delete(id); });
    for (let i = 0; i < stuur.length; i += 60) {
      const r = await vraag({ rijen: stuur.slice(i, i + 60) });
      if (!r || !r.ok) throw new Error(r && r.fout || "versturen");
    }
    ids.forEach(id => { if (meta[id] && meta[id].g === gBij[id]) dirty.delete(id); });

    const kKonNiet = !kanDelen("keuring");
    sync.soorten = Array.isArray(r.soorten) ? r.soorten.map(String) : OUDE_SOORTEN;
    sync.vapid = typeof r.vapid === "string" ? r.vapid : "";
    if (r.bestanden && !sync.bestanden && store.get("wpbFotoWacht", []).some(x => x.startsWith("d_"))) nogEens = true;
    sync.bestanden = !!r.bestanden;
    sync.aangemeld = r.aangemeld;
    if (kKonNiet && kanDelen("keuring") && teVersturen().length) nogEens = true; // script net bijgewerkt: keuringen meteen sturen
    const opServer = new Set();
    let veranderd = false;
    for (const row of r.rijen || []) {
      if (!LIJST[row.soort]) continue;
      opServer.add(row.id);
      if (dirty.has(row.id)) continue;
      const lg = (meta[row.id] || {}).g || 0;
      if (row.gewijzigd <= lg) continue;
      const arr = LIJST[row.soort];
      if (row.weg) {
        db[arr] = db[arr].filter(o => o.id !== row.id);
        meta[row.id] = { s: row.soort, g: row.gewijzigd, weg: 1 };
      } else {
        let o; try { o = JSON.parse(row.data); } catch (e) { continue; }
        if (!o || o.id !== row.id) continue;
        const i = db[arr].findIndex(x => x.id === row.id);

    for (const soort of Object.keys(LIJST).filter(kanDelen)) for (const o of db[LIJST[soort]]) {
      if (!opServer.has(o.id) && !dirty.has(o.id)) { meta[o.id] = { s: soort, g: Math.max((meta[o.id] || {}).g || 0, 2) }; dirty.add(o.id); nogEens = true; }
    }

    sync.laatst = Date.now(); store.set("wpbLaatst", sync.laatst); sync.fout = "";
    pushControle();

  } catch (e) {
    sync.fout = String(e && e.message) === "code" ? "Groepscode klopt niet" : (navigator.onLine ? "Bijwerken lukte niet, probeert het zo opnieuw" : "Geen bereik, probeert het later opnieuw");

}
function statusTekst() {

/* ---------- pushmeldingen ---------- */
// De melding zelf is leeg; de service worker haalt de tekst op bij het script (?berichten=). Daarvoor bewaart de app
// in de cache "wpb-push" waar en met welke code (de service worker kan niet bij localStorage).
const pushKan = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const b64uBytes = s => { const b = atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function pushConfig(nieuw) {
  try {
    const c = await caches.open("wpb-push"), oud = await c.match("config").then(r => r && r.json()).catch(() => null);
    const cfg = { url: groepUrl(), code: groep.code.trim(), apparaat: apparaatId, laatst: (!nieuw && oud && oud.laatst) || Date.now() - 60000 };
    await c.put("config", new Response(JSON.stringify(cfg), { headers: { "Content-Type": "application/json" } }));
  } catch (e) {}
}
async function pushAan(keuze, stil) {
  if (!pushKan()) throw new Error("Deze browser kan geen meldingen ontvangen.");
  if (!sync.vapid) throw new Error("Het Google-script van de groep moet eerst bijgewerkt worden (zie handleiding).");
  if (Notification.permission !== "granted") {
    if (stil) throw new Error("geen toestemming");
    if (await Notification.requestPermission() !== "granted") throw new Error("Meldingen zijn geblokkeerd. Zet ze aan bij de site-instellingen (slotje naast het adres) of bij de app-instellingen van de telefoon.");
  }
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (sub && push.vapid && push.vapid !== sync.vapid) { await sub.unsubscribe().catch(() => {}); sub = null; }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(sync.vapid) });
  const j = sub.toJSON();
  await pushConfig(!push.aan);
  const r = await vraag({ abonnement: { endpoint: j.endpoint, p256dh: (j.keys || {}).p256dh, auth: (j.keys || {}).auth, naam: me, dringend: keuze.dringend, keuring: keuze.keuring } });
  if (!r || !r.ok) throw new Error("Aanmelden bij de groep lukte niet" + (r && r.fout ? " (" + r.fout + ")" : "") + ".");
  push = { aan: true, dringend: !!keuze.dringend, keuring: !!keuze.keuring, endpoint: j.endpoint, vapid: sync.vapid, t: Date.now() };
  store.set("wpbPush", push);
}
async function pushUit() {
  try { const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch (e) {}
  push = Object.assign({}, push, { aan: false, endpoint: "" }); store.set("wpbPush", push);
  try { await vraag({ afmelden: 1 }); } catch (e) {}
}
// Bij het bijwerken: abonnement nog in orde? Zo niet (verlopen, nieuwe sleutel, toestemming weg) stil opnieuw aanmelden.
let pushGecontroleerd = false;
async function pushControle() {
  if (pushGecontroleerd || !push.aan || !pushKan() || !groepAan() || !sync.vapid) return;
  pushGecontroleerd = true;
  try {
    let sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
    // Het script gooit een abonnement weg als de pushdienst zegt dat het niet meer bestaat: dan een nieuw aanvragen
    if (sub && sync.aangemeld === false) { await sub.unsubscribe().catch(() => {}); sub = null; }
    if (!sub || sub.endpoint !== push.endpoint || push.vapid !== sync.vapid || sync.aangemeld === false || Date.now() - (push.t || 0) > 7 * DAY) await pushAan(push, true);
    else await pushConfig(false);
  } catch (e) {}
}

/* ---------- machines ---------- */
function catChips(list, sel, attr) {
  const cnt = c => c === "Alles" ? list.length : list.filter(m => catOf(m) === c).length;
  return ["Alles", ...CATS].filter(c => c === "Alles" || cnt(c) > 0).map(c => `<button type="button" ${attr}="${c}" aria-pressed="${sel === c}">${c}<span class="c">${cnt(c)}</span></button>`).join("");
}
function renderMachines() {
  $("#tabs").hidden = true;
  const mc = $("#mcats"); mc.hidden = false; mc.innerHTML = catChips(db.machines, mcat, "data-cat");
  const yr = new Date().getFullYear();
  const q = $("#mzoek").value.trim(); $("#mzoek").hidden = false;
  const ms = db.machines.filter(m => (mcat === "Alles" || catOf(m) === mcat) && zoekPast(m, q)).sort(opNr);
  const due = ms.map(m => ({ m, s: ohStatus(m) })).filter(o => o.s.lvl === "late" || o.s.lvl === "soon").sort((a, b) => (a.s.lvl === "late" ? 0 : 1) - (b.s.lvl === "late" ? 0 : 1));
  // Machines zonder vastgelegde beurt: in één keer doorlopen (zelfde volgorde als hieronder)
  const zonder = CATS.flatMap(c => ms.filter(m => catOf(m) === c)).filter(beurtNodig);
  instelLijst = zonder.map(m => m.id);
  const instelHTML = zonder.length ? `<button class="due instel" data-instel="1"><span><span class="mname">Laatste beurt invullen</span><span class="sub">Nog bij ${zonder.length} ${zonder.length === 1 ? "machine" : "machines"}. Met Opslaan, volgende loop je ze achter elkaar door.</span></span><span class="go" aria-hidden="true">›</span></button>` : "";
  const kv = kVerloopt(ms), heeftK = db.keuringen.some(k => ms.some(m => m.id === k.machineId));
  const keurHTML = !heeftK ? "" : `<h2 class="section-h">Keuringen</h2>` + (kv.length
    ? `<div class="duelist">${kv.map(({ k, s }) => `<button class="due" data-keur="${esc(k.id)}"><span><span class="mname">${nrNaam(mach(k.machineId), "?")} · ${esc(k.soort)}</span><span class="sub">${esc(s.txt)} (${fmtDate(k.tot)})</span></span><span class="chip ${s.lvl}">${s.lvl === "late" ? "Verlopen" : "Binnenkort"}</span></button>`).join("")}</div>`
    : `<p class="empty" style="padding:16px">Alle keuringen zijn geldig.</p>`);
  const dueHTML = due.length || zonder.length ? `<div class="duelist">${instelHTML}${due.map(({ m, s }) => `<button class="due" data-mach="${esc(m.id)}"><span><span class="mname">${nrNaam(m)}</span><span class="sub">${esc(s.txt)}</span></span><span class="chip ${s.lvl}">${OHL[s.lvl]}</span></button>`).join("")}</div>`
    : `<p class="empty" style="padding:16px">Er is niks aan de beurt.</p>`;
  const chips = (m, s) => {
    const k = kVerloopt([m]), c = [];
    if (s.lvl !== "none") c.push(`<span class="chip ${s.lvl}">${OHL[s.lvl]}</span>`);
    if (k.length) c.push(`<span class="chip ${k.some(o => o.s.lvl === "late") ? "late" : "soon"}">Keuring ${k.some(o => o.s.lvl === "late") ? "verlopen" : "binnenkort"}</span>`);
    return c.length ? `<span class="chips">${c.join("")}</span>` : "";
  };
  const tile = m => {
    const all = db.meldingen.filter(x => x.machineId === m.id);
    const open = all.filter(x => x.status !== "klaar").length;
    const dit = all.filter(x => new Date(x.t).getFullYear() === yr).length;
    const s = ohStatus(m);
    return `<button class="mtile" data-mach="${esc(m.id)}"><span class="t">${m.nr ? esc(m.nr) + " · " : ""}${esc(m.type || catOf(m))}${m.urenteller && m.uren != null ? " · " + nf(m.uren) + " u" : ""}</span><span class="nm">${esc(m.naam)}</span>${m.kenteken ? `<span class="kent">${esc(m.kenteken)}</span>` : ""}<span class="st">${open ? `<b>${open} open</b> · ` : ""}${dit}× gemeld dit jaar</span>${chips(m, s)}</button>`;
  };
  const grid = mcat === "Alles"
    ? CATS.map(c => { const l = ms.filter(m => catOf(m) === c); return l.length ? `<h2 class="section-h">${c} (${l.length})</h2><div class="mgrid">${l.map(tile).join("")}</div>` : ""; }).join("")
    : `<h2 class="section-h">${mcat} (${ms.length})</h2><div class="mgrid">${ms.map(tile).join("")}</div>`;
  if (q) { // zoeken: alleen de gevonden machines
    $("#view").innerHTML = ms.length ? grid : `<p class="empty">Niks gevonden voor "${esc(q)}"${mcat !== "Alles" ? ` in ${esc(mcat)}. Probeer het bij Alles` : ""}.</p>`;
    return;
  }
  $("#view").innerHTML = `${keurHTML}<h2 class="section-h">Onderhoud aan de beurt</h2>${dueHTML}${grid}
   <div class="actions" style="margin-top:16px"><button class="btn" id="addMach" type="button">+ Machine toevoegen</button><button class="btn" id="pdfAlles" type="button">Alles als PDF</button><button class="btn" id="csvAlles" type="button">Alles naar Excel</button></div>`;
}

function render() {
  counts();
  if (mcat !== "Alles" && !db.machines.some(m => catOf(m) === mcat)) mcat = "Alles";
  view === "meldingen" ? renderMeldingen() : renderMachines();
  vulFotos($("#view"));
  if (view === "meldingen") { $("#navMeld").setAttribute("aria-current", "page"); $("#navMach").removeAttribute("aria-current"); }
  else { $("#navMach").setAttribute("aria-current", "page"); $("#navMeld").removeAttribute("aria-current"); }
}

/* ---------- vensters ---------- */
let sheetAangeraakt = false;
function openSheet(html, onMount) {
  const root = $("#sheetRoot");
  root.innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov = $("#ov");
  // Een tik of klik naast het venster doet niks: sluiten alleen met ×.
  // Esc sluit zolang er nog niks is ingevuld of gekozen.
  sheetAangeraakt = false;
  ov.querySelector(".sheet").addEventListener("input", () => sheetAangeraakt = true);
  ov.querySelector(".sheet").addEventListener("change", () => sheetAangeraakt = true);
  ov.querySelector(".sheet").addEventListener("click", e => { if (e.target.closest("button:not(.x), label")) sheetAangeraakt = true; });
  ov.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheet));
  onMount && onMount(ov);
  vulFotos(ov);
  ov.querySelector(".sheet").scrollTop = 0;
}
function closeSheet() { $("#sheetRoot").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("#viewer").hidden) $("#viewer").hidden = true; else if (!sheetAangeraakt) closeSheet(); } });
// Tik op een foto: schermvullend (knijpen om in te zoomen); tik op × om terug te gaan
$("#sheetRoot").addEventListener("click", e => { const img = e.target.closest(".gallery img"); if (!img) return; $("#viewerImg").src = img.src; $("#viewer").hidden = false; });
$("#viewerX").onclick = () => { $("#viewer").hidden = true; $("#viewerImg").removeAttribute("src"); };
const head = t => `<div class="sheet-h"><h2>${t}</h2><button class="x" data-close aria-label="Sluiten">×</button></div>`;
// Twee keer tikken om te bevestigen (geen confirm()); armed(knop, tekst-bij-eerste-tik, actie)
function armed(btn, tekst, doe) {
  btn.addEventListener("click", () => { if (!btn.dataset.sure) { btn.dataset.sure = "1"; btn.dataset.oud = btn.textContent; btn.textContent = tekst; setTimeout(() => { if (btn.isConnected && btn.dataset.sure) { delete btn.dataset.sure; btn.textContent = btn.dataset.oud; } }, 4000); return; } doe(); });
}

function setStatus(id, st) {
  const x = db.meldingen.find(m => m.id === id); if (!x) return;
  const doIt = () => {
    const n = Object.assign({}, x, { status: st });
    if (st === "klaar") { n.tKlaar = Date.now(); n.klaarDoor = me; }
    if (st === "open") { delete n.tKlaar; delete n.klaarDoor; }
    wijzig("storing", n); render(); toast(st === "klaar" ? "Afgevinkt" : "Weer open gezet");
  };
  me ? doIt() : instellingen(doIt);
}

function newMelding(preMach) {
  const last = {}; db.meldingen.forEach(x => { if (x.machineId) last[x.machineId] = Math.max(last[x.machineId] || 0, x.t); });
  const ordered = [...db.machines].sort((a, b) => (last[b.id] || 0) - (last[a.id] || 0) || a.naam.localeCompare(b.naam, "nl", { numeric: true }));
  const st = { fotos: [], machineId: preMach || null, overig: false, prio: null, cat: "Alles" };
  openSheet(`${head("Storing melden")}
    <div class="field"><span class="lbl">Foto's <span>(max. ${MAXFOTO})</span></span>
      <div class="fotos" id="fotos"></div>
      <input class="vh" id="cam" type="file" accept="image/*" capture="environment">
      <input class="vh" id="gal" type="file" accept="image/*" multiple></div>
    <div class="field"><label for="msearch">Welke machine?</label>
      <input id="msearch" type="search" placeholder="Zoek op naam, nummer, soort of kenteken" autocomplete="off">
      <div class="cats" id="fcats"></div>
      <div class="mpick" id="mpick"></div>
      <input id="mvrij" type="text" placeholder="Wat is het dan?" hidden></div>
    <div class="field" id="urenF" hidden><label for="uren">Urenstand <span>(als je 'm weet)</span></label>
      <input id="uren" type="text" inputmode="numeric"></div>
    <div class="field"><label for="tekst">Wat is er aan de hand?</label>
      <textarea id="tekst" placeholder="Kort is prima. Bijv. 'slang lekt achter links'"></textarea></div>
    <div class="field"><span class="lbl">Hoe dringend?</span>
      <div class="prio"><button type="button" data-p="dringend" aria-pressed="false">Dringend</button><button type="button" data-p="tijd" aria-pressed="false">Als er tijd is</button></div></div>
    <div class="field"><label for="door">Gemeld door</label><input id="door" type="text" value="${esc(me)}" placeholder="Jouw naam"></div>
    <p class="err" id="err" hidden></p>
    <button class="btn primary groot" id="plaats">Storing melden</button>`, ov => {
    const pick = ov.querySelector("#mpick"), q = ov.querySelector("#msearch"), vrij = ov.querySelector("#mvrij"), urenF = ov.querySelector("#urenF"), urenI = ov.querySelector("#uren");
    const drawFotos = () => {
      ov.querySelector("#fotos").innerHTML = st.fotos.map((f, i) => `<div class="fprev"><img src="${f.thumb}" alt="Foto ${i + 1}"><button type="button" data-rm="${i}" aria-label="Foto ${i + 1} weghalen">×</button></div>`).join("") +
        (st.fotos.length < MAXFOTO ? `<label class="fbtn" for="cam"><span><strong>Camera</strong>foto maken</span></label><label class="fbtn" for="gal"><span><strong>Galerij</strong>foto's kiezen</span></label>` : "");
    };
    const drawUren = () => { const m = st.machineId && mach(st.machineId); urenF.hidden = !(m && m.urenteller); if (m && m.urenteller) urenI.placeholder = m.uren != null ? `Laatst bekend: ${nf(m.uren)}` : "Bijv. 4650"; };
    const drawPick = () => {
      const s = q.value.trim().toLowerCase();
      ov.querySelector("#fcats").innerHTML = catChips(db.machines, st.cat, "data-fc");
      const list = ordered.filter(m => (st.cat === "Alles" || catOf(m) === st.cat) && zoekPast(m, s));
      pick.innerHTML = list.map(m => `<button type="button" data-m="${esc(m.id)}" aria-pressed="${st.machineId === m.id}">${esc(m.naam)}<small>${m.nr ? esc(m.nr) + " · " : ""}${esc(m.type || catOf(m))}</small></button>`).join("") +
        `<button type="button" data-m="__overig" aria-pressed="${st.overig}">Overig<small>staat er niet tussen</small></button>`;
    };
    drawFotos(); drawPick(); drawUren(); q.addEventListener("input", drawPick);
    ov.querySelector("#fcats").addEventListener("click", e => { const b = e.target.closest("[data-fc]"); if (!b) return; st.cat = b.dataset.fc; drawPick(); });
    ov.querySelector("#fotos").addEventListener("click", e => { const b = e.target.closest("[data-rm]"); if (b) { st.fotos.splice(+b.dataset.rm, 1); drawFotos(); } });
    const addFiles = async e => {
      const files = [...e.target.files].slice(0, MAXFOTO - st.fotos.length);
      for (const f of files) { try { st.fotos.push(Object.assign({ id: nieuwId("f_") }, await maakFoto(f))); } catch (_) { toast("Een foto kon niet geladen worden"); } }
      e.target.value = ""; drawFotos();
    };
    ov.querySelector("#cam").addEventListener("change", addFiles); ov.querySelector("#gal").addEventListener("change", addFiles);
    pick.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.m === "__overig") { st.overig = true; st.machineId = null; vrij.hidden = false; vrij.focus(); } else { st.overig = false; st.machineId = b.dataset.m; vrij.hidden = true; }
      drawPick(); drawUren();
    });
    ov.querySelectorAll(".prio button").forEach(b => b.onclick = () => { st.prio = b.dataset.p; ov.querySelectorAll(".prio button").forEach(o => o.setAttribute("aria-pressed", o === b)); });
    ov.querySelector("#plaats").onclick = async () => {
      const tekst = ov.querySelector("#tekst").value.trim(), door = ov.querySelector("#door").value.trim(), vr = vrij.value.trim(), u = urenF.hidden ? null : numOrNull(urenI.value);
      const err = ov.querySelector("#err"); const fail = m => { err.textContent = m; err.hidden = false; };
      if (!st.machineId && !(st.overig && vr)) return fail("Kies een machine, of vul bij Overig in wat het is.");
      if (!tekst && !st.fotos.length) return fail("Zet er een foto of een korte omschrijving bij.");
      if (!st.prio) return fail("Kies of het dringend is of kan wachten.");
      if (!door) return fail("Vul je naam in.");
      if (door !== me) { me = door; store.set("wpbNaam", me); setWho(); }
      const ids = [];
      for (const f of st.fotos) { try { await fotoDb.set(f.id, f.data); fotoMem.set(f.id, f.data); ids.push(f.id); } catch (e) { toast("Een foto kon niet bewaard worden"); } }
      if (ids.length) store.set("wpbFotoWacht", store.get("wpbFotoWacht", []).concat(ids));
      const x = { id: nieuwId("s_"), machineId: st.machineId, tekst: tekst || "(zie foto)", prio: st.prio, status: "open", door, fotos: ids, uren: u, t: Date.now() };
      if (st.overig) x.machineVrij = vr;
      if (st.fotos.length && ids.includes(st.fotos[0].id)) x.thumb = st.fotos[0].thumb;
      wijzig("storing", x);
      if (st.machineId) bumpUren(st.machineId, u);
      closeSheet(); view = "meldingen"; tab = st.prio; syncTabs(); render(); toast("Storing gemeld");
    };
  });
}

function detail(id) {
  const x = db.meldingen.find(m => m.id === id); if (!x) return;
  const other = x.prio === "dringend" ? "tijd" : "dringend";
  const actions = [];
  if (x.status !== "klaar") actions.push(`<button class="btn done" data-s="klaar">Klaar</button>`);
  else actions.push(`<button class="btn" data-s="open">Weer openzetten</button>`);
  if (x.status !== "klaar") actions.push(`<button class="btn" data-prio="${other}">Naar ${other === "dringend" ? "Dringend" : "Als er tijd is"}</button>`);
  actions.push(`<button class="btn warn" id="delM">Verwijderen</button>`);
  const f = x.fotos || [];
  openSheet(`${head(nrVan(x))}
    ${f.length ? `<div class="gallery">${f.map(s => `<div class="gf" data-foto="${esc(s)}"><span class="ph">foto laden…</span></div>`).join("")}</div>` : ""}
    <p class="grote">${esc(x.tekst)}</p>
    <div class="kv">
      <div><span>Status</span><span class="chip ${x.status === "klaar" ? "klaar" : "open"}">${STAT[x.status] || "Open"}</span></div>
      <div><span>Hoe dringend</span><span class="chip ${x.prio === "dringend" ? "dringend" : "open"}">${x.prio === "dringend" ? "Dringend" : "Als er tijd is"}</span></div>
      <div><span>Gemeld</span><span>${fmtDate(x.t)} door ${esc(x.door)}</span></div>
      ${x.uren != null ? `<div><span>Urenstand</span><span>${nf(x.uren)} uur</span></div>` : ""}
      ${x.tKlaar ? `<div><span>Klaar</span><span>${fmtDate(x.tKlaar)}${x.klaarDoor ? " door " + esc(x.klaarDoor) : ""}</span></div>` : ""}
    </div>
    <div class="actions">${actions.join("")}</div>
    ${x.machineId ? `<button class="linkish" data-hist="${esc(x.machineId)}">Alles van deze machine</button>` : ""}`, ov => {
    ov.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { closeSheet(); setStatus(id, b.dataset.s); });
    ov.querySelectorAll("[data-prio]").forEach(b => b.onclick = () => { wijzig("storing", Object.assign({}, x, { prio: b.dataset.prio })); closeSheet(); render(); toast("Verplaatst"); });
    const h = ov.querySelector("[data-hist]"); h && (h.onclick = () => machineDetail(h.dataset.hist));
    armed(ov.querySelector("#delM"), "Zeker weten? Tik nog een keer", () => { verwijder("storing", id); closeSheet(); render(); toast("Storing verwijderd"); });
  });
}

function machineDetail(mid) {
  const m = mach(mid); if (!m) return;
  const ms = db.meldingen.filter(x => x.machineId === mid);
  const yr = new Date().getFullYear();
  const dit = ms.filter(x => new Date(x.t).getFullYear() === yr).length;
  const open = ms.filter(x => x.status !== "klaar").length;
  const s = ohStatus(m), lo = lastOh(mid), ks = keuringenVan(mid);
  const tl = [...ms.map(x => ({ t: x.t, k: "m", x })), ...db.onderhoud.filter(o => o.machineId === mid).map(o => ({ t: o.t, k: "o", x: o }))].sort((a, b) => b.t - a.t);
  const tlHTML = tl.length ? tl.map(e => e.k === "o"
    ? `<button type="button" class="h hb" data-oh="${esc(e.x.id)}"><span class="d">${fmtDate(e.t)}</span><div><p>${esc(e.x.wat)}</p><div class="meta"><span class="chip oh">Onderhoud</span>${e.x.uren != null ? `<span>${nf(e.x.uren)} uur</span>` : ""}<span>${esc(e.x.door)}</span></div></div><span class="go" aria-hidden="true">›</span></button>`
    : `<button type="button" class="h hb" data-mid="${esc(e.x.id)}"><span class="d">${fmtDate(e.t)}</span><div><p>${esc(e.x.tekst)}</p><div class="meta"><span class="chip ${e.x.status === "klaar" ? "klaar" : "open"}">${STAT[e.x.status] || "Open"}</span>${e.x.prio === "dringend" ? '<span class="chip dringend">Dringend</span>' : ""}<span>${esc(e.x.door)}${e.x.klaarDoor ? " → " + esc(e.x.klaarDoor) : ""}</span></div></div><span class="go" aria-hidden="true">›</span></button>`).join("")
    : '<p class="empty">Nog niks vastgelegd.</p>';
  openSheet(`${head(nrNaam(m))}
    <p class="hint" style="margin-top:-8px">${esc(m.type || catOf(m))}${m.kenteken ? ` · kenteken <b>${esc(m.kenteken)}</b>` : ""}${m.model || m.bouwjaar ? "<br>" + esc([m.model, m.bouwjaar ? "bouwjaar " + m.bouwjaar : ""].filter(Boolean).join(" · ")) : ""}${m.chassis ? `<br>chassisnr. <span style="user-select:all">${esc(m.chassis)}</span>` : ""}</p>
    ${m.info ? `<div class="kv"><div><span>Info</span><span style="white-space:pre-wrap;text-align:left">${esc(m.info)}</span></div></div>` : ""}
    <div class="stats">
      <div class="stat"><b>${m.urenteller ? (m.uren != null ? nf(m.uren) : "?") : "–"}</b><span>${m.urenteller ? "urenstand" : "geen urenteller"}</span></div>
      <div class="stat"><b>${open}</b><span>nu open</span></div>
      <div class="stat"><b>${dit}</b><span>gemeld dit jaar</span></div>
    </div>
    <div class="actions"><button class="btn primary" id="meldHier">+ Storing melden</button><button class="btn" id="mEdit">Bewerken</button></div>
    <span class="lbl">Onderhoud</span>
    <div class="kv">
      <div><span>Status</span><span class="chip ${s.lvl}">${OHL[s.lvl]}</span></div>
      ${s.lvl !== "none" ? `<div><span>Volgende beurt</span><span>${esc(s.txt)}</span></div>` : ""}
      <div><span>Laatste beurt</span><span>${lo ? `${fmtDate(lo.t)}${lo.uren != null ? " · " + nf(lo.uren) + " u" : ""}` : "nog niet vastgelegd"}</span></div>
      <div><span>Interval</span><span>${ivTxt(m.interval || {})}</span></div>
    </div>
    <div class="actions" style="margin-top:-6px">
      ${lo ? "" : '<button class="btn" id="lbIn">Laatste beurt invullen</button>'}
      <button class="btn done" id="ohDone">Onderhoud gedaan</button>
      ${m.urenteller ? '<button class="btn" id="urenUpd">Urenstand bijwerken</button>' : ""}
    </div>
    <span class="lbl">Keuringen</span>
    ${ks.length ? `<div class="duelist" style="margin-top:0">${ks.map(k => { const ksx = kStatus(k); return `<button class="due" data-keur="${esc(k.id)}"><span><span class="mname">${esc(k.soort)}</span><span class="sub">${ksx.lvl === "ok" ? esc(ksx.txt) : esc(ksx.txt) + " (" + fmtDate(k.tot) + ")"}</span></span><span class="chip ${ksx.lvl}">${KL[ksx.lvl]}</span></button>`; }).join("")}</div>` : '<p class="hint">Nog geen keuringen. Bijv. APK, kraankeuring of hijsmiddelen.</p>'}
    ${groepAan() && sync.soorten && !kanDelen("keuring") ? '<p class="hint">Keuringen staan nu alleen op dit apparaat: het Google-script van de groep moet nog bijgewerkt worden.</p>' : ""}
    <div class="actions" style="margin-top:-6px"><button class="btn" id="kNieuw">+ Keuring</button></div>
    <span class="lbl">Geschiedenis</span>
    <div class="hist">${tlHTML}</div>
    <span class="lbl">Bewaren</span>
    <div class="actions" style="margin-top:-6px"><button class="btn" id="mPdf">PDF / afdrukken</button><button class="btn" id="mCsv">Naar Excel</button></div>`, ov => {
    ov.querySelector("#meldHier").onclick = () => newMelding(mid);
    ov.querySelector("#mEdit").onclick = () => machineForm(mid);
    ov.querySelector("#mCsv").onclick = () => exporteer(mid);
    ov.querySelector("#mPdf").onclick = () => afdrukken(mid);
    ov.querySelector("#kNieuw").onclick = () => keuringForm(mid, null);
    ov.querySelectorAll("[data-keur]").forEach(b => b.onclick = () => keuringDetail(b.dataset.keur));

/* ---------- keuringsrapporten (PDF of foto) ---------- */
// Bestand d_... in dezelfde IndexedDB-store als de foto's; in de groep als <id>.pdf/.jpg in de Drive-map.
const isBestandData = d => typeof d === "string" && /^data:(application\/pdf|image\/(jpeg|png|webp));base64,[A-Za-z0-9+/=]+$/.test(d);
const MAXBESTAND = 10 * 1024 * 1024;
function bestandOmschr(id) {
  for (const k of db.keuringen) for (const h of k.hist || []) {
    const b = (h.bestanden || []).find(x => x.id === id);
    if (b) return [mach(k.machineId)?.nr, mach(k.machineId)?.naam, k.soort, "gekeurd " + csvDatum(h.t), b.naam].filter(Boolean).join(" · ");
  }
  return "";
}
async function bestandData(id) {
  let d = await fotoDb.get(id).catch(() => null);
  if (d) return d;
  if (!groepAan() || !navigator.onLine) return null;
  try { const r = await vraag(null, id); if (r && r.ok && isBestandData(r.data)) { fotoDb.set(id, r.data).catch(() => {}); return r.data; } } catch (e) {}
  return null;
}
async function openBestand(b) {
  // pc: nieuw tabblad met de pdf-viewer (meteen openen, anders houdt de browser het tegen); telefoon: downloaden/openen
  const pc = window.matchMedia && matchMedia("(pointer: fine)").matches, w = pc && b.naam.toLowerCase().endsWith(".pdf") ? window.open("", "_blank") : null;
  toast("Rapport laden…");
  const d = await bestandData(b.id);
  if (!d) { if (w) w.close(); toast(groepAan() ? "Rapport is nog niet binnen (geen bereik, of nog niet verstuurd)" : "Rapport niet gevonden op deze telefoon"); return; }
  if (d.startsWith("data:image/")) { if (w) w.close(); $("#viewerImg").src = d; $("#viewer").hidden = false; return; }
  const url = URL.createObjectURL(await (await fetch(d)).blob());
  if (w) { w.location.href = url; }
  else { const a = document.createElement("a"); a.href = url; a.download = b.naam || "rapport.pdf"; document.body.appendChild(a); a.click(); a.remove(); }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
// Bestanden in een venster slepen (pc): zone krijgt een rand, loslaten = fn(files)
const isPc = () => !!(window.matchMedia && matchMedia("(pointer: fine)").matches);
const sleepBestanden = e => [...((e.dataTransfer && e.dataTransfer.types) || [])].includes("Files");
function sleepZone(el, fn) {
  let n = 0;
  el.addEventListener("dragenter", e => { if (!sleepBestanden(e)) return; e.preventDefault(); n++; el.classList.add("slepen"); });
  el.addEventListener("dragover", e => { if (sleepBestanden(e)) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; } });
  el.addEventListener("dragleave", () => { if (--n <= 0) { n = 0; el.classList.remove("slepen"); } });
  el.addEventListener("drop", e => { if (!sleepBestanden(e)) return; e.preventDefault(); e.stopPropagation(); n = 0; el.classList.remove("slepen"); if (e.dataTransfer.files.length) fn([...e.dataTransfer.files]); });
}
// Een bestand dat naast een venster valt mag de app niet wegklikken (de browser zou het anders openen)
document.addEventListener("dragover", e => { if (sleepBestanden(e)) e.preventDefault(); });
document.addEventListener("drop", e => { if (sleepBestanden(e)) { e.preventDefault(); toast("Sleep het rapport op een keuring of in het venster Gekeurd"); } });
function leesBestand(file) {
  if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
    if (file.size > MAXBESTAND) return Promise.reject(new Error("Dit bestand is te groot (max. 10 MB)."));
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res({ naam: file.name, data: String(r.result).replace(/^data:[^;]*;/, "data:application/pdf;") }); r.onerror = () => rej(new Error("Bestand kon niet gelezen worden.")); r.readAsDataURL(file); });
  }
  if (/^image\//.test(file.type)) return maakFoto(file).then(f => ({ naam: (file.name || "foto").replace(/\.[^.]+$/, "") + ".jpg", data: f.data }));
  return Promise.reject(new Error("Alleen een PDF of een foto."));
}

      <input class="vh" id="gf" type="file" accept="application/pdf,image/*" multiple>

    const tekenB = () => {
      ov.querySelector("#gb").innerHTML = bestanden.map((b, i) => `<span class="btn" style="display:inline-flex;align-items:center;gap:6px"><button type="button" data-open="${i}" style="border:0;background:none;padding:0;font:inherit;color:inherit">${esc(b.naam)}</button><button type="button" data-weg="${i}" aria-label="${esc(b.naam)} weghalen" style="border:0;background:none;padding:0 2px;font:inherit;color:var(--muted)">×</button></span>`).join("")

    };
    tekenB();
    ov.querySelector("#gb").addEventListener("click", e => {
      const w = e.target.closest("[data-weg]"); if (w) { const b = bestanden.splice(+w.dataset.weg, 1)[0]; delete nieuw[b.id]; tekenB(); return; }
      const o = e.target.closest("[data-open]"); if (o) { const b = bestanden[+o.dataset.open]; if (nieuw[b.id]) fotoDb.set(b.id, nieuw[b.id]).catch(() => {}).then(() => openBestand(b)); else openBestand(b); }
    });
    const voegToe = async lijst => {
      sheetAangeraakt = true; // Esc sluit dit venster dan niet meer per ongeluk
      if (bestanden.length + lijst.length > 5) { err0.textContent = "Maximaal 5 rapporten per keuring."; err0.hidden = false; }
      for (const f of lijst.slice(0, 5 - bestanden.length)) {
        try { const b = await leesBestand(f); const id = nieuwId("d_"); nieuw[id] = b.data; bestanden.push({ id, naam: b.naam }); }
        catch (x) { err0.textContent = x.message; err0.hidden = false; }
      }
      tekenB();
    };
    ov.querySelector("#gf").addEventListener("change", async e => { await voegToe([...e.target.files]); e.target.value = ""; });
    sleepZone(ov.querySelector(".sheet"), voegToe);
    if (startBestanden && startBestanden.length) voegToe(startBestanden);
    let totZelf = !!h0;
    gt.addEventListener("input", () => totZelf = true);
    gd.addEventListener("input", () => { if (!totZelf && gd.value) gt.value = voorstel(gd.value); });
    ov.querySelector("#gOk").onclick = async () => {
      const err = ov.querySelector("#err"), fail = t => { err.textContent = t; err.hidden = false; };

      if (!door) return fail("Vul in wie hem gekeurd heeft (bedrijf) of wie het geregeld heeft.");
      const opgeslagen = [];

      const regel = { t: Math.min(t, Date.now()), tot, door, opm: ov.querySelector("#go").value.trim() };
      if (bestanden.length) regel.bestanden = bestanden.map(b => ({ id: b.id, naam: b.naam }));
      const hist = (h0 ? (k.hist || []).map((x, i) => i === hi ? regel : x) : [regel, ...(k.hist || [])]).sort((a, b) => b.t - a.t).slice(0, 50);
      wijzig("keuring", Object.assign({}, k, { tot: nieuweTot(hist), hist })); render(); keuringDetail(kid); toast(h0 ? "Keuring aangepast" : "Keuring vastgelegd");
    };
    const del = ov.querySelector("#gDel");
    del && armed(del, "Zeker weten? Tik nog een keer", () => {
      const hist = (k.hist || []).filter((x, i) => i !== hi);
      wijzig("keuring", Object.assign({}, k, { tot: nieuweTot(hist), hist })); render(); keuringDetail(kid); toast("Keuring verwijderd");
    });
  });
}

/* ---------- exporteren naar Excel (csv) ---------- */
// Momentopname: status zoals hij nu is. Puntkomma als scheiding en een BOM, dan opent Nederlandse Excel hem meteen goed.
const csvDatum = ts => { const d = new Date(ts); return String(d.getDate()).padStart(2, "0") + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + d.getFullYear(); };
const csvCel = v => {
  let t = v == null ? "" : String(v);
  if (/^[=+\-@\t\r]/.test(t) && !/^-?\d+$/.test(t)) t = "'" + t; // geen formules uit vrije tekst
  return /[";\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
};
const csvSleutel = info => (info[0] || "~") + " " + info[1]; // nummer, dan naam
function csvRegels(mid) {
  const kop = ["Nr", "Machine", "Categorie", "Soort", "Kenteken", "Chassisnummer", "Datum", "Wat", "Omschrijving", "Urenstand", "Door", "Status", "Hoe dringend", "Opgelost op", "Opgelost door"];
  const rij = [];
  const mInfo = x => { const m = x.machineId ? mach(x.machineId) : null; return m ? [m.nr || "", m.naam, catOf(m), m.type || "", m.kenteken || "", m.chassis || ""] : ["", mName(x), "Overig", "", "", ""]; };
  db.onderhoud.filter(o => !mid || o.machineId === mid).forEach(o => rij.push({ n: csvSleutel(mInfo(o)), t: o.t, c: [...mInfo(o), csvDatum(o.t), "Onderhoud", o.wat, o.uren ?? "", o.door, "Gedaan", "", "", ""] }));
  db.meldingen.filter(x => !mid || x.machineId === mid).forEach(x => {
    const klaar = x.status === "klaar";
    rij.push({ n: csvSleutel(mInfo(x)), t: x.t, c: [...mInfo(x), csvDatum(x.t), "Storing", x.tekst, x.uren ?? "", x.door, klaar ? "Opgelost" : "Nog open", x.prio === "dringend" ? "Dringend" : "Als er tijd is", klaar && x.tKlaar ? csvDatum(x.tKlaar) : "", klaar ? x.klaarDoor || "" : ""] });
  });
  db.keuringen.filter(k => !mid || k.machineId === mid).forEach(k => {
    const info = mInfo(k), regels = (k.hist || []).length ? k.hist : [{ t: 0, tot: k.tot, door: "", opm: "" }];
    regels.forEach((h, i) => rij.push({ n: csvSleutel(info), t: h.t, c: [...info, h.t ? csvDatum(h.t) : "", "Keuring", k.soort + (h.opm ? ": " + h.opm : ""), "", h.door, (i === 0 ? (kStatus(k).lvl === "late" ? "Verlopen, was geldig tot " : "Geldig tot ") : "Was geldig tot ") + csvDatum(h.tot), "", "", ""] }));
  });
  rij.sort((a, b) => a.n.localeCompare(b.n, "nl", { numeric: true }) || a.t - b.t);
  return [kop, ...rij.map(r => r.c)].map(r => r.map(csvCel).join(";")).join("\r\n") + "\r\n";
}
async function exporteer(mid) {
  const m = mid ? mach(mid) : null, vandaag = new Date().toISOString().slice(0, 10);
  const naam = "werkplaatsbord-" + (m ? m.naam.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") : "alle-machines") + "-" + vandaag + ".csv";
  const blob = new Blob(["\ufeff" + csvRegels(mid)], { type: "text/csv;charset=utf-8" });
  // Telefoon: via Delen (mail, WhatsApp, Drive). Pc: gewoon downloaden.
  const tel = /Android|iPhone|iPad|iPod/.test(navigator.userAgent || "");
  if (tel && navigator.canShare && typeof File === "function") {
    const f = new File([blob], naam, { type: "text/csv" });
    if (navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], title: naam }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = naam;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  toast("Opgeslagen als " + naam);
}
