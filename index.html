        return `<tr><td class="nw">${esc(m.nr || "")}</td><td>${esc(m.naam)}${m.kenteken ? ` <span class="pr-k">${esc(m.kenteken)}</span>` : ""}</td><td>${esc(catOf(m))}</td><td class="r">${m.urenteller && m.uren != null ? nf(m.uren) : ""}</td><td class="nw">${lo ? csvDatum(lo.t) : ""}</td><td>${OHL[s.lvl]}${s.lvl !== "none" && s.lvl !== "onb" ? " · " + esc(s.txt) : ""}</td><td class="r">${open || ""}</td></tr>`;
      }).join("")}</tbody></table>
      ${vrij.length ? `<h2>Overig (niet in de lijst)</h2><table><thead><tr><th>Gemeld</th><th>Wat</th><th>Storing</th><th>Status</th></tr></thead><tbody>${vrij.map(x => `<tr><td class="nw">${csvDatum(x.t)}</td><td>${esc(mName(x))}</td><td>${esc(x.tekst)}</td><td class="nw">${x.status === "klaar" ? "Opgelost" + (x.tKlaar ? " " + csvDatum(x.tKlaar) : "") : "<b>Nog open</b>"}</td></tr>`).join("")}</tbody></table>` : ""}
      <p class="pr-voet">Werkplaatsbord · momentopname van ${nu}. Hierna een pagina per machine waar onderhoud of storingen bij staan.</p></section>`;
  }
  // Bij alles: alleen een eigen pagina voor machines waar iets bij staat (de rest staat in het overzicht)
  if (!mid) {
    const zonder = ms.filter(beurtNodig);
    if (zonder.length) html += `<section class="pr-pag pr-invul"><h1>Laatste beurt invullen</h1>
      <p class="pr-sub">Vul in wat je weet (ongeveer is goed) en zet het daarna in de app: Machines › Laatste beurt invullen › Opslaan, volgende. Zelfde volgorde als hier.</p>
      <table><thead><tr><th>Machine</th><th>Uren nu</th><th>Datum laatste beurt</th><th>Uren toen</th><th>Wat gedaan</th><th>Elke … uur</th><th>Elke … mnd</th></tr></thead><tbody>${zonder.map(m => {
        const leeg = m.urenteller ? "" : "–", iv = m.interval || {};
        return `<tr><td>${esc(m.naam)}<br><span class="pr-k">${m.nr ? esc(m.nr) + " · " : ""}${esc(catOf(m))}</span></td><td>${m.urenteller ? (m.uren != null ? `<span class="pr-k">${nf(m.uren)}?</span>` : "") : "–"}</td><td></td><td>${leeg}</td><td></td><td>${m.urenteller ? (iv.uren ? nf(iv.uren) : "") : "–"}</td><td>${iv.maanden || ""}</td></tr>`;
      }).join("")}</tbody></table>
      <p class="pr-voet">Werkplaatsbord · invullijst van ${nu}</p></section>`;
  }
  html += ms.filter(m => mid || db.onderhoud.some(o => o.machineId === m.id) || db.meldingen.some(x => x.machineId === m.id) || db.keuringen.some(k => k.machineId === m.id)).map(m => prMachine(m, nu)).join("");
  $("#printRoot").innerHTML = html;
  // De titel wordt de voorgestelde bestandsnaam van de PDF
  const oud = document.title, m = mid && mach(mid);
  document.title = "Werkplaatsbord " + (m ? m.naam : "alle machines") + " " + new Date().toISOString().slice(0, 10);
  const terug = () => { document.title = oud; $("#printRoot").innerHTML = ""; window.removeEventListener("afterprint", terug); };
  window.addEventListener("afterprint", terug);
  setTimeout(() => window.print(), 50);
}

/* ---------- instellingen en groep ---------- */
function meldingenHTML() {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent || "") || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (!pushKan()) return `<p class="hint">${ios ? "Op een iPhone werken meldingen alleen als de app op het beginscherm staat (iOS 16.4 of nieuwer). Open hem dan vanaf het beginscherm." : "Deze browser kan geen meldingen ontvangen."}</p>`;
  if (!sync.vapid) return `<p class="hint">${sync.soorten ? "Het Google-script van de groep moet eerst bijgewerkt worden (zie handleiding)." : "Nog niet bijgewerkt met de groep. Probeer het zo nog eens."}</p>`;
  return `<label class="check"><input id="pD" type="checkbox" ${push.dringend !== false ? "checked" : ""}> Dringende storingen (meteen)</label>
    <label class="check"><input id="pK" type="checkbox" ${push.keuring !== false ? "checked" : ""}> Keuringen en onderhoud (’s ochtends)</label>
    ${push.aan ? '<p class="hint">Meldingen staan aan.</p>' : ""}
    <div class="actions"><button class="btn${push.aan ? "" : " primary"}" id="pAan" type="button">${push.aan ? "Keuze opslaan" : "Meldingen aanzetten"}</button>${push.aan ? '<button class="btn" id="pTest" type="button">Testmelding</button><button class="btn warn" id="pUit" type="button">Uitzetten</button>' : ""}</div>
    <p class="err" id="pErr" hidden></p>`;
}
function meldingenKnoppen(ov) {
  const aan = ov.querySelector("#pAan"); if (!aan) return;
  const err = ov.querySelector("#pErr"), fout = t => { err.textContent = t; err.hidden = false; };
  const bezig = (b, ja) => { b.disabled = ja; };
  aan.onclick = async () => {
    err.hidden = true; bezig(aan, true);
    try { await pushAan({ dringend: ov.querySelector("#pD").checked, keuring: ov.querySelector("#pK").checked }); toast(push.aan ? "Meldingen staan aan" : "Opgeslagen"); instellingen(); }
    catch (e) { fout(String(e && e.message || e)); bezig(aan, false); }
  };
  const t = ov.querySelector("#pTest");
  t && (t.onclick = async () => {
    err.hidden = true; bezig(t, true);
    try {
      const r = await vraag({ testmelding: 1 });
      if (!r || !r.ok) fout("Lukte niet" + (r && r.fout ? " (" + r.fout + ")" : "") + ". Zet meldingen uit en weer aan.");
      else if (r.status >= 200 && r.status < 300) toast("Verstuurd, komt zo binnen");
      else fout(r.status === 404 || r.status === 410 ? "Dit abonnement bestaat niet meer. Zet meldingen uit en weer aan." : "De pushdienst weigerde de melding (code " + r.status + ").");
    } catch (e) { fout(navigator.onLine ? "Versturen lukte niet." : "Geen bereik."); }
    bezig(t, false);
  });
  const u = ov.querySelector("#pUit");
  u && armed(u, "Zeker? Tik nog een keer", async () => { await pushUit(); toast("Meldingen uit"); instellingen(); });
}
function installLink(metGroep) { return SITE + "installeren.html" + (metGroep && groep.code ? "?groep=" + encodeURIComponent(groep.code.trim()) : ""); }
function kopieer(tekst, vak) {
  const toon = () => { vak.hidden = false; vak.textContent = tekst; };
  try { navigator.clipboard.writeText(tekst).then(() => { toast("Link gekopieerd"); toon(); }, toon); } catch (e) { toon(); }
}
function instellingen(daarna) {
  openSheet(`${head("Instellingen")}
    <div class="field"><label for="sNaam">Jouw naam</label><input id="sNaam" type="text" value="${esc(me)}" autocomplete="given-name" placeholder="Bijv. Henk"></div>
    <span class="lbl">Groep</span>
    <p class="hint">Met de groep ziet iedereen dezelfde storingen, machines en onderhoud. Zonder groep blijft alles op deze telefoon.</p>
    <label class="check"><input id="gAan" type="checkbox" ${groep.aan ? "checked" : ""}> Meedoen met de groep</label>
    <div class="field"><label for="gCode">Groepscode</label><input id="gCode" type="text" value="${esc(groep.code)}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    ${GROEP_URL_VAST ? "" : `<div class="field"><label for="gUrl">Web-app-URL <span>(van het Google-script, eindigt op /exec)</span></label><input id="gUrl" type="url" value="${esc(store.get("wpbGroepUrl", ""))}" autocomplete="off" spellcheck="false"></div>`}
    <p class="err" id="err" hidden></p>
    <div class="actions"><button class="btn primary groot" id="sOk">Opslaan</button>${groepAan() ? '<button class="btn" id="sNu">Nu bijwerken</button>' : ""}</div>
    ${groepAan() ? `<span class="lbl">Meldingen op dit apparaat</span>${meldingenHTML()}` : ""}
    <span class="lbl">Doorsturen</span>
    <div class="actions"><button class="btn" id="sLink">Kopieer installatielink</button>${groep.code ? '<button class="btn" id="sLinkG">Link met groep</button>' : ""}</div>
    <p class="copybox" id="sLinkTxt" hidden></p>
    <p class="hint">Versie ${VERSIE}</p>`, ov => {
    ov.querySelector("#sOk").onclick = () => {
      const naam = ov.querySelector("#sNaam").value.trim(), aan = ov.querySelector("#gAan").checked, code = ov.querySelector("#gCode").value.trim();
      const urlI = ov.querySelector("#gUrl"), err = ov.querySelector("#err");
      if (!naam) { err.textContent = "Vul je naam in."; err.hidden = false; return; }
      if (aan && !code) { err.textContent = "Vul de groepscode in, of zet het vinkje uit."; err.hidden = false; return; }
      if (urlI) { const u = urlI.value.trim(); if (aan && u && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) { err.textContent = "De web-app-URL moet beginnen met https://script.google.com/ en eindigen op /exec."; err.hidden = false; return; } store.set("wpbGroepUrl", u); }
      const codeAnders = code !== groep.code;
      me = naam; store.set("wpbNaam", me); setWho();
      groep = { code, aan }; store.set("wpbGroep", groep);
      if (codeAnders) { sync.laatst = 0; sync.fout = ""; if (push.aan) pushConfig(false); }
      closeSheet(); toast("Opgeslagen"); statusTekst();
      if (groepAan()) syncNu();
      daarna && daarna();
    };
    const nu = ov.querySelector("#sNu"); nu && (nu.onclick = () => { syncNu(); toast("Bijwerken…"); });
    meldingenKnoppen(ov);
    const vak = ov.querySelector("#sLinkTxt");
    ov.querySelector("#sLink").onclick = () => kopieer(installLink(false), vak);
    const lg = ov.querySelector("#sLinkG"); lg && (lg.onclick = () => kopieer(installLink(true), vak));
    if (!me) ov.querySelector("#sNaam").focus();
  });
}
// Uitnodiging: installeren.html?groep=<code> zet hem klaar, of de app zelf geopend met ?groep=<code>
function neemUitnodiging() {
  let code = "";
  try { const p = new URLSearchParams(location.search); code = p.get("groep") || ""; if (code) history.replaceState(null, "", location.pathname); } catch (e) {}
  const u = store.get("wpbGroepUitnodiging", null);
  if (!code && u && u.code) code = u.code;
  store.del("wpbGroepUitnodiging");
  if (!code) return false;
  groep = { code: String(code).trim(), aan: true }; store.set("wpbGroep", groep);
  sync.laatst = 0; statusTekst(); if (groepAan()) syncNu();
  toast("Je doet mee met de groep");
  return true;
}

/* ---------- starten ---------- */
function syncTabs() { document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab)); }
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.tab; syncTabs(); render(); });
$("#mcats").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (!b) return; mcat = b.dataset.cat; render(); window.scrollTo(0, 0); });
$("#view").addEventListener("click", e => {
  const tg = e.target.closest("[data-toggle]"); if (tg) { const k = tg.dataset.toggle; openGroups.has(k) ? openGroups.delete(k) : openGroups.add(k); render(); return; }
  const a = e.target.closest("[data-act]"); if (a) { setStatus(a.dataset.id, a.dataset.act); return; }
  const d = e.target.closest("[data-detail]"); if (d) { detail(d.dataset.detail); return; }
  const m = e.target.closest("[data-mach]"); if (m) { machineDetail(m.dataset.mach); return; }
  const kk = e.target.closest("[data-keur]"); if (kk) { keuringDetail(kk.dataset.keur); return; }
  if (e.target.closest("[data-instel]")) { if (instelLijst.length) instelForm(instelLijst.slice(), 0); return; }
  if (e.target.id === "addMach") machineForm(null);
  if (e.target.id === "csvAlles") exporteer(null);
  if (e.target.id === "pdfAlles") afdrukken(null);
});
$("#fab").onclick = () => newMelding();
$("#navMeld").onclick = () => { view = "meldingen"; render(); window.scrollTo(0, 0); };
$("#navMach").onclick = () => { view = "machines"; render(); window.scrollTo(0, 0); };
$("#mzoek").addEventListener("input", () => { render(); window.scrollTo(0, 0); });
$("#mzoek").addEventListener("keydown", e => {
  if (e.key === "Escape") { e.target.value = ""; render(); }
  if (e.key === "Enter") { e.preventDefault(); const t = $("#view").querySelectorAll(".mtile"); if (t.length === 1) t[0].click(); else e.target.blur(); }
});
$("#whoBtn").onclick = () => instellingen();
$("#voet").textContent = "Werkplaatsbord · versie " + VERSIE;
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { if (neemUitnodiging() && !me) instellingen(); planSync(200); } });
window.addEventListener("online", () => planSync(500));
window.addEventListener("storage", e => { if (e.key === "wpbGroepUitnodiging" && e.newValue) { if (neemUitnodiging() && !me) instellingen(); } });
setInterval(() => { if (document.visibilityState === "visible") planSync(0); }, 120000);

// Niet geïnstalleerd op een telefoon: tip om hem op het beginscherm te zetten (wegtikken = onthouden)
(() => {
  const ua = navigator.userAgent || "", tel = /Android|iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const los = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  if (tel && !los && !store.get("wpbTipWeg", false)) $("#installTip").hidden = false;
  $("#installTipWeg").onclick = () => { store.set("wpbTipWeg", true); $("#installTip").hidden = true; };
})();
if (!groepAan()) lijstInlezen(); // met de groep: na de eerste geslaagde sync
setWho(); render(); statusTekst();
neemUitnodiging();
if (!me) instellingen();
planSync(300);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
